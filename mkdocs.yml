site_name: Harsh Kanth
site_url: https://harshkanth.com
site_author: Harsh Kanth
site_description: >-
  Harsh Kanth is a technical writer and documentation architect with 10+ years
  of experience writing product, API, and enterprise documentation for SAP,
  Microsoft, OneShield, and fast-moving product teams.
repo_url: https://github.com/harshkanth/harsh-kanth
repo_name: harshkanth/harsh-kanth
edit_uri: ""
copyright: >-
  &copy; 2026 Harsh Kanth &middot; Written, structured, and built in Markdown with MkDocs

theme:
  name: material
  custom_dir: overrides
  logo: assets/images/logo.svg
  favicon: assets/images/favicon.svg
  language: en
  font:
    text: Manrope
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tooltips

extra_css:
  - assets/stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/harsh-kanth-53974164/
      name: LinkedIn
    - icon: fontawesome/brands/github
      link: https://github.com/harshkanth
      name: GitHub
    - icon: fontawesome/brands/whatsapp
      link: https://wa.me/917827620848
      name: WhatsApp
    - icon: fontawesome/solid/envelope
      link: mailto:harshhh10@gmail.com
      name: Email

plugins:
  - search

nav:
  - Home: index.md
  - Work:
      - work/index.md
      - SAP DER MCM product assistance: work/sap-der-mcm.md
      - IGA Application Onboarding Hub suite: work/avancer-iga-onboarding-hub.md
      - Style guide and docs governance: work/avancer-docs-governance.md
      - Microsoft Teams developer docs: work/microsoft-teams.md
      - RPA docs-as-code migration: work/exl-rpa-docs.md
      - Insurance platform documentation: work/oneshield.md
      - Documentation overhaul across four companies: work/vision-group.md
  - Samples:
      - samples/index.md
      - Install Microsoft Teams: samples/install-microsoft-teams.md
      - Schedule a meeting in Microsoft Teams: samples/schedule-teams-meeting.md
  - Experience: experience.md
  - Services: services.md
  - About: about.md
  - Contact: contact.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.blocks.caption
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
